<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EggLink Marketplace</title>
<link rel="stylesheet" href="css/marketplace.css">
</head>
<body>
<!-- Sidebar (same as dashboard) -->
<div class="sidebar">
  <div class="logo-area">
    <img src="assets/logo.png" alt="EggLink Logo" class="logo-img">
    <h1>EggLink</h1>
  </div>

  <a href="index.html">Dashboard</a>
  <a href="listings.html">Listings</a>
  <a class="active" href="marketplace.html">Marketplace</a>
  <a href="messages.html">Messages <span id="msg-count">0</span></a>
  <a href="orders.html">Orders <span id="order-count">0</span></a>
  <a href="notifications.html">Notifications <span id="notif-count">0</span></a>
  <a href="settings.html">Settings</a>

  <div class="sidebar-bottom">
    <a href="#" id="logout-btn" class="logout-btn">Logout</a>
  </div>
</div>

<!-- Main content -->
<div class="main">
  <h1>Marketplace</h1>
  <p>Browse and connect with egg suppliers</p>

  <div class="market-search">
    <input type="text" id="searchInput" placeholder="Search by supplier, egg type, or location...">
    <select id="sortSelect">
      <option value="nearest">Nearest First</option>
      <option value="highest">Highest Rating</option>
    </select>
  </div>

  <div class="market-filters">
    <button class="type-filter" data-type="all">All Types</button>
    <button class="type-filter" data-type="organic">Organic</button>
    <button class="type-filter" data-type="free-range">Free Range</button>
    <button class="type-filter" data-type="cage-free">Cage-Free</button>
    <button class="type-filter" data-type="white">White</button>
    <button class="type-filter" data-type="brown">Brown</button>
  </div>

  <div id="suppliersContainer" class="suppliers-container">
    <!-- JS will populate supplier cards -->
  </div>
</div>

<script src="js/markplace.js"></script>
<script>
// Logout function for all pages
const logoutBtn = document.getElementById("logout-btn");
    if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
            // Remove login info from localStorage
            localStorage.removeItem("isLoggedIn");
            localStorage.removeItem("userEmail");
            // Redirect to login page
            window.location.href = "login.html";
            });
    };
</script>

</body>
</html>
